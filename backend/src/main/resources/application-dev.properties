server.port=8080
spring.application.name=zero-to-hundreds-hunt

# Embedded H2 Database configuration for instant development & testing
spring.datasource.url=jdbc:h2:file:./data/hunt_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=9a6747f3a7787f7396696b0144d9f67a2f5f190e0c0be766ef96144e59e21182c694a1d48c82361099b2447990ff5dcf85b2e3e5bc87ff3e72898c6b738e41eb
app.jwt.expiration-ms=86400000

ai.service.enabled=false
ai.service.api-key=${AI_API_KEY:}
ai.service.model=gemini-1.5-flash
ai.service.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

app.cors.allowed-origins=*
