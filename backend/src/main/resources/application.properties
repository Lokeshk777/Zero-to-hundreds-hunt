server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=zero-to-hundreds-hunt

# Database Configuration (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/zero_to_hundreds_hunt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
app.jwt.secret=9a6747f3a7787f7396696b0144d9f67a2f5f190e0c0be766ef96144e59e21182c694a1d48c82361099b2447990ff5dcf85b2e3e5bc87ff3e72898c6b738e41eb
app.jwt.expiration-ms=86400000

# AI Configuration (Real AI API configuration support)
ai.service.enabled=true
ai.service.api-key=${AI_TEXT_API_KEY:YOUR_GEMINI_API_KEY_HERE}
ai.service.model=${AI_TEXT_MODEL:gemini-3.8-flash}
ai.service.api-url=https://generativelanguage.googleapis.com/v1beta/models

# AI Image Generation Configuration
ai.image.api-key=${HUGGINGFACE_API_KEY:YOUR_HF_API_KEY_HERE}
ai.image.model=${AI_IMAGE_MODEL:black-forest-labs/FLUX.1-schnell}

# Storage Configuration (Local Disk Development vs Cloud Object Storage Production)
app.storage.provider=${STORAGE_PROVIDER:LOCAL_DISK}
app.storage.base-path=${STORAGE_BASE_PATH:storage/story-visualizations}
app.server.base-url=${SERVER_BASE_URL:}

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500
